[package]
name = "embergate"
version = "0.7.5"
edition = "2021"
rust-version = "1.89"
description = "A self-hosted reverse proxy and management dashboard powered by Pingora"
license = "Apache-2.0"
publish = false

[dependencies]
pingora = { path = "../pingora/pingora", features = ["proxy", "openssl", "cache"] }
async-trait = "0.1"
arc-swap = "1.7"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
env_logger = "0.11"
log = "0.4"
openssl = "0.10"
tokio-openssl = "0.6"
httparse = "1"
instant-acme = { version = "0.8.5", default-features = false, features = ["hyper-rustls", "ring", "rcgen"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ipnet = "2"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
bytes = "1"
brotli = "3"
webauthn-rs = "0.5.5"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
lru = "0.18"
httpdate = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
