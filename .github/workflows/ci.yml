name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Rust, dashboard, and local integrations
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install native and integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang perl openssl curl python3-brotli
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: gateway -> target
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check formatting
        run: cargo fmt --check
      - name: Check dashboard
        run: |
          npm test
          npm run check
      - name: Dashboard browser checks
        env:
          BROWSER_BIN: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Rust tests and build
        run: |
          cargo test --locked
          cargo build --locked
      - name: Native gRPC integration checks
        run: node tests/grpc-smoke.mjs
      - name: Passkey browser checks
        env:
          BROWSER_BIN: /usr/bin/google-chrome
        run: node tests/passkeys-browser-smoke.mjs
      - name: Build product website and check its browser flows
        env:
          BROWSER_BIN: /usr/bin/google-chrome
        run: |
          python3 ../website/build.py
          python3 -m http.server 17684 --bind 127.0.0.1 --directory ../website/dist &
          site_server_pid=$!
          trap 'kill "$site_server_pid" 2>/dev/null || true' EXIT
          node ../website/test.mjs
      - name: Local integration checks
        shell: bash
        run: |
          /usr/bin/python3 tests/run-integrations.py --jobs 3 --log-dir "${{ runner.temp }}/integration-logs"
      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: ${{ runner.temp }}/integration-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: /tmp/embergate-*.png
          if-no-files-found: ignore
          retention-days: 7

  container:
    name: Build container image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          docker compose config --quiet
          docker compose --env-file .env.example config --quiet
          docker compose -f deploy/cluster-compose.yaml config --quiet
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: embergate:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=embergate
          cache-to: type=gha,scope=embergate,mode=max
      - name: Smoke-test documented Compose deployment
        run: |
          python3 gateway/tests/container-smoke.py --image embergate:ci
          python3 gateway/tests/cluster-compose-smoke.py --image embergate:ci
      - name: Export tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: docker save embergate:ci | gzip -1 > /tmp/embergate-image.tar.gz
      - name: Upload tested image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: tested-container-image
          path: /tmp/embergate-image.tar.gz
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish verified image
    needs: [checks, container]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@v4
        with:
          name: tested-container-image
          path: /tmp/embergate-image
      - name: Load tested image
        run: gzip -dc /tmp/embergate-image/embergate-image.tar.gz | docker load
      - name: Select image tags
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
          flavor: latest=false
      - name: Log in to GitHub Container Registry
        if: steps.metadata.outcome == 'success'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        if: steps.metadata.outcome == 'success'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag embergate:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
