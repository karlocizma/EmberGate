global
  maxconn 4096

defaults
  mode tcp
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend plain_http
  bind :8080
  mode http
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Forwarded-Proto http
  default_backend http_gateways

backend http_gateways
  mode http
  option httpchk GET /healthz/ready
  http-check expect status 200
  server primary primary:8080 check port 9090 inter 1s fall 2 rise 2
  server follower follower:8080 backup check port 9090 inter 1s fall 2 rise 2

# TLS stays end-to-end with EmberGate. No certificate keys are loaded into HAProxy.
frontend encrypted_https
  bind :8443
  default_backend tls_gateways

backend tls_gateways
  option httpchk GET /healthz/ready
  http-check expect status 200
  server primary primary:8443 check port 9090 inter 1s fall 2 rise 2
  server follower follower:8443 backup check port 9090 inter 1s fall 2 rise 2
