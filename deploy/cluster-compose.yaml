# Start with: docker compose -f deploy/cluster-compose.yaml up -d --no-build
# Configure roles and tokens in each node's Settings → Instances after first-run setup.
services:
  primary:
    image: ${EMBERGATE_IMAGE:-ghcr.io/karlocizma/embergate:latest}
    restart: unless-stopped
    stop_grace_period: 310s
    environment:
      GATEWAY_HTTPS_ADDR: 0.0.0.0:8443
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - primary-data:/data
  follower:
    image: ${EMBERGATE_IMAGE:-ghcr.io/karlocizma/embergate:latest}
    restart: unless-stopped
    stop_grace_period: 310s
    environment:
      GATEWAY_HTTPS_ADDR: 0.0.0.0:8443
    ports:
      - "127.0.0.1:19091:9090"
    volumes:
      - follower-data:/data
  edge:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:8080"
      - "127.0.0.1:443:8443"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - primary
      - follower
volumes:
  primary-data:
  follower-data:
